name: Pre-game prediction snapshot

# Runs at 5pm ET (21:00 UTC) on Finals game days. Snapshots the current model's
# prediction for the upcoming game so we can score it after the result is in.
on:
  schedule:
    - cron: "0 21 * * *"   # 5pm ET daily (will no-op on non-game days)
  workflow_dispatch:
    inputs:
      game_num:
        description: "Game number (1-7). Leave blank to auto-detect."
        required: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -q numpy pandas scipy requests nba_api pyarrow

      - name: Determine game number
        id: game
        run: |
          GAME_NUM="${{ github.event.inputs.game_num }}"
          if [ -z "$GAME_NUM" ]; then
            # Auto-detect: count Finals games already played from data, add 1
            GAME_NUM=$(python -c "
          import pandas as pd
          from pathlib import Path
          p = Path('data/team_games.parquet')
          if not p.exists():
              print(1); exit()
          df = pd.read_parquet(p)
          # Finals: GAME_ID round digit '4', between NYK and SAS
          finals = df[df['GAME_ID'].str.contains('0042500')]
          # 2025-26 playoff series IDs start with 0042500
          # 0042500401 = Finals G1, 0042500402 = G2, etc (last two digits = game in series for Finals)
          finals_games = finals[finals['GAME_ID'].str.contains('00425004')]['GAME_ID'].nunique()
          print(finals_games + 1)
            ")
          fi
          echo "game_num=$GAME_NUM" >> $GITHUB_OUTPUT
          echo "Snapshotting Game $GAME_NUM"

      - name: Snapshot prediction
        run: |
          if [ "${{ steps.game.outputs.game_num }}" -le "7" ]; then
            python scorecard.py snapshot --game ${{ steps.game.outputs.game_num }}
          else
            echo "Series already complete, skipping"
          fi

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/prediction_snapshots/
          if git diff --staged --quiet; then
            echo "No snapshot created"
          else
            git commit -m "Snapshot Game ${{ steps.game.outputs.game_num }} prediction"
            git push
          fi
